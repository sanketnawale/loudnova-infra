apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public-proxy
  namespace: gateway-infra
  labels:
    app.kubernetes.io/name: public-proxy
    app.kubernetes.io/part-of: cloudnova-platform
spec:
  concurrency: 1
  routingType: Service

  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1

        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

      envoyService:
        name: public-envoy
        type: ClusterIP
