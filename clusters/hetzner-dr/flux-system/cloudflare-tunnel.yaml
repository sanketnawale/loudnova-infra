apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-tunnel
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/hetzner-dr/platform/networking/cloudflare-tunnel
  prune: true
  wait: true
  timeout: 5m

  dependsOn:
    - name: envoy-gateway-runtime

  sourceRef:
    kind: GitRepository
    name: flux-system
