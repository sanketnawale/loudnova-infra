apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnova-dashboard
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/hetzner-dr/apps/cloudnova-dashboard
  prune: true
  wait: true
  timeout: 5m

  dependsOn:
    - name: envoy-gateway-runtime

  sourceRef:
    kind: GitRepository
    name: flux-system
