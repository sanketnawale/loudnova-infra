  name: mira-metabase
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/hetzner-dr/apps/mira-metabase
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: envoy-gateway-runtime
  wait: true
  timeout: 5m