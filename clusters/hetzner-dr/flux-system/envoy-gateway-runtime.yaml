apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-runtime
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/hetzner-dr/platform/networking/envoy-gateway/runtime
  prune: true
  wait: true
  timeout: 5m

  dependsOn:
    - name: envoy-gateway-install

  sourceRef:
    kind: GitRepository
    name: flux-system
