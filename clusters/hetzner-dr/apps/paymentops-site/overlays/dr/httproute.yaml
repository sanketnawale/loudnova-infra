# Public marketing route on the Hetzner staging/failover cluster:
# paymentops-hetzner.cloudnova.tech -> paymentops-website.
#
# NOTE: External exposure requires a matching Cloudflare Tunnel ingress rule and DNS record
# (remotely managed in Cloudflare Zero Trust). The in-cluster routing is complete; external
# DNS is intentionally not modified by GitOps.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paymentops-website
  namespace: paymentops-site
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-infra
      sectionName: http
  hostnames:
    - paymentops-hetzner.cloudnova.tech
  rules:
    - backendRefs:
        - name: paymentops-website
          port: 80
