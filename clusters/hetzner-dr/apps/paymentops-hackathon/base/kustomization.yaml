apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Note: application Secrets (DB password, Evolus keys, operator client, admin bootstrap)
# are NOT committed. They are created out-of-band in the namespace (see
# docs/PHASE2_DEPLOY.md). Only non-secret configuration is in configmap.yaml.
resources:
  - namespace.yaml
  - configmap.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - migration-job.yaml
  - seed-job.yaml
  - networkpolicy.yaml
