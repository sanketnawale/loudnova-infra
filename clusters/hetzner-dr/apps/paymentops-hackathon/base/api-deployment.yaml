apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentops-hackathon-api
  namespace: paymentops-hackathon
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Recreate (not RollingUpdate) to avoid a surge pod on the resource-constrained
  # single arm64 node (observed ~85% memory in use).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paymentops-hackathon-api
  template:
    metadata:
      labels:
        app: paymentops-hackathon-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until pg_isready -h paymentops-hackathon-postgres -U paymentops_hackathon
              -d paymentops_hackathon; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 48Mi
      containers:
        - name: paymentops-hackathon-api
          image: ghcr.io/sanketnawale/paymentops-hackathon-api:sha-pending0001
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: paymentops-hackathon-config
            - secretRef:
                name: paymentops-hackathon-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
