# Public route for the PaymentOps hackathon: frontend + the Evolus validation tool.
#
# Exposed via the shared Cloudflare Tunnel -> Envoy `public-gateway` (host-based routing).
# The tunnel origin is the Envoy data-plane Service `public-envoy`; Envoy dispatches by Host
# header, exactly like the other published apps. TLS is terminated at Cloudflare (the gateway
# listener is HTTP), so there is no in-cluster certificate/issuer here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paymentops-hackathon-web
  namespace: paymentops-hackathon
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-infra
      sectionName: http
  hostnames:
    - paymentops-hackathon.cloudnova.tech
  rules:
    # Evolus validation WebAPI tool -> API service (auth enforced by the app via X-Tool-Key).
    # Only this narrow prefix reaches the API directly; operator endpoints stay behind the
    # authenticated web proxy.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/evolus
      backendRefs:
        - name: paymentops-hackathon-api
          port: 8000
    # Everything else (frontend + its same-origin auth/backend proxies) -> web service.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: paymentops-hackathon-web
          port: 80
