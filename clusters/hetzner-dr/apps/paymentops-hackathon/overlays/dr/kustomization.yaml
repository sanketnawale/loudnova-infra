apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - httproute.yaml

# Immutable image tags for the hackathon deployment. Replace `sha-pending0001` with the
# concrete tag actually published to the registry (see docs/PHASE2_DEPLOY.md). Do not use
# `latest`.
images:
  - name: ghcr.io/sanketnawale/paymentops-hackathon-api
    newTag: e7dac72b09a89fbe7c1c2bca96364c4dc7413d84
  # Web is unchanged since this tag; the arm64 `next build` is intermittently flaky under
  # QEMU emulation (SIGILL in SWC), so we keep the previously published equivalent image.
  - name: ghcr.io/sanketnawale/paymentops-hackathon-web
    newTag: ef7f8d626717ae41a3273cee0776274da6cd9769
