apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - httproute.yaml

# Immutable image tags for the hackathon deployment. Replace `sha-pending0001` with the
# concrete tag actually published to the registry (see docs/PHASE2_DEPLOY.md). Do not use
# `latest`.
images:
  - name: ghcr.io/sanketnawale/paymentops-hackathon-api
    newTag: a49dcc515fc9673bec0f65fb94b6c2b8ded33d91
  # Web is unchanged except a cosmetic line; the arm64 web build failed on a flaky
  # `next/font` Google-Fonts fetch. Keep the previously published, equivalent web image.
  - name: ghcr.io/sanketnawale/paymentops-hackathon-web
    newTag: cff57ce1cda2004d2d418c8838ca68b745c18ce4
