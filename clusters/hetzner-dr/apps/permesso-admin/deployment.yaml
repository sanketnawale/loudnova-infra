apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: permesso-admin
spec:
  replicas: 1
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: adminer

  template:
    metadata:
      labels:
        app: adminer

    spec:
      automountServiceAccountToken: false

      containers:
        - name: adminer
          image: adminer:5

          env:
            - name: ADMINER_DEFAULT_SERVER
              value: "10.42.0.1:5433"

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL