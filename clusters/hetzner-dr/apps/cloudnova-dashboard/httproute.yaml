apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudnova-dashboard
  namespace: cloudnova-dashboard
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-infra
      sectionName: http

  hostnames:
    - dashboard.cloudnova.tech

  rules:
    - backendRefs:
        - name: metabase
          port: 3000