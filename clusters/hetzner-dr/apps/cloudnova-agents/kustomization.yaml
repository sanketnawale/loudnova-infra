apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudnova-agents

resources:
  - namespace.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - ollama-tunnel/proxy-config.yaml
  - ollama-tunnel/deployment.yaml
  - ollama-tunnel/service.yaml
  - workforce/job.yaml

configMapGenerator:
  - name: cloudnova-workforce-code
    files:
      - main.py=workforce/main.py

generatorOptions:
  disableNameSuffixHash: true
