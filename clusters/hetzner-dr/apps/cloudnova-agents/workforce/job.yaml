apiVersion: batch/v1
kind: Job
metadata:
  name: cloudnova-workforce-test
  namespace: cloudnova-agents
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: cloudnova-workforce
    spec:
      restartPolicy: Never
      containers:
        - name: workforce
          image: python:3.12-alpine
          command:
            - python
            - -u
            - /app/main.py
          env:
            - name: OLLAMA_URL
              value: "http://ollama:11434/api/generate"
            - name: OLLAMA_MODEL
              value: "qwen2.5:3b"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true

      volumes:
        - name: code
          configMap:
            name: cloudnova-workforce-code