apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-tunnel
  namespace: cloudnova-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-tunnel
  template:
    metadata:
      labels:
        app: ollama-tunnel
    spec:
      containers:
        - name: tunnel
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache openssh-client
              chmod 600 /ssh/id_ed25519
              exec ssh \
                -N \
                -o ExitOnForwardFailure=yes \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=3 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile=/ssh/known_hosts \
                -i /ssh/id_ed25519 \
                -L 127.0.0.1:11435:127.0.0.1:11434 \
                cloudnova-tunnel@213.199.48.152
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: ssh
              mountPath: /ssh
              readOnly: true

        - name: proxy
          image: nginx:1.27-alpine
          ports:
            - containerPort: 11434
              name: ollama
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 25m
              memory: 32Mi
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

      volumes:
        - name: ssh
          secret:
            secretName: ollama-tunnel-ssh
            defaultMode: 0400

        - name: proxy-config
          configMap:
            name: ollama-proxy-config