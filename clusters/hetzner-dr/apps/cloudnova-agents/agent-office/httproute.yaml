  namespace: cloudnova-agents
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-infra
  hostnames:
    - agents.cloudnova.tech
  rules:
    - backendRefs:
        - name: cloudnova-agent-office
          port: 4520