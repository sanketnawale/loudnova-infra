apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentops-website
  namespace: paymentops-site
  labels:
    app: paymentops-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentops-website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: paymentops-website
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paymentops-website
          image: ghcr.io/cloodnova/paymentops-website:ecd62aff22c1e9350f48ef3ef46c253d22d57a94
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_SITE_URL
              value: https://paymentops.cloudnova.tech
            - name: NEXT_PUBLIC_APP_URL
              value: https://paymentops-app.cloudnova.tech
            - name: NEXT_PUBLIC_GA_MEASUREMENT_ID
              value: G-NS75TXH0CQ
            - name: GA_MEASUREMENT_ID
              value: G-NS75TXH0CQ
            - name: SMTP_HOST
              value: server376.web-hosting.com
            - name: SMTP_PORT
              value: "465"
            - name: SMTP_SECURE
              value: "true"
            - name: PAYMENTOPS_NOTIFICATION_EMAIL
              value: paymentops@cloudnova.tech
            - name: MAIL_FROM
              value: "CloudNova PaymentOps <paymentops@cloudnova.tech>"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: paymentops-site-smtp
                  key: smtp-user
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paymentops-site-smtp
                  key: smtp-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 150m
              memory: 192Mi
      volumes:
        - name: next-cache
          emptyDir: {}
