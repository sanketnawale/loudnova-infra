apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: hello-web
  labels:
    app.kubernetes.io/name: hello-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: website-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: website-content
          configMap:
            name: hello-web-content