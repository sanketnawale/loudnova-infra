# Public routes for the PaymentOps web frontend.
#   - app.paymentops.cloudnova.tech  -> private authenticated application
#   - paymentops-dev.cloudnova.tech  -> development/testing application (not marketed)
# NOTE: hostnames must have DNS (or a Cloudflare tunnel route) pointing at the Envoy gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paymentops-web-dev
  namespace: paymentops
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-infra
      sectionName: http
  hostnames:
    - app.paymentops.cloudnova.tech
    - paymentops-dev.cloudnova.tech
  rules:
    - backendRefs:
        - name: paymentops-web
          port: 80
