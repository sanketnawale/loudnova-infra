apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentops-web
  namespace: paymentops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentops-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: paymentops-web
    spec:
      automountServiceAccountToken: false
      # Private GHCR images; credential is a cluster-side secret (not committed to Git).
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paymentops-web
          image: ghcr.io/cloodnova/paymentops-web:7e835cdeb25f77ae98ddc98098a58a53f29143d6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Browser-facing base URL: same-origin proxy path (never an internal service URL).
            - name: NEXT_PUBLIC_API_URL
              value: /api/backend
            # Public marketing site (for login-page links).
            - name: NEXT_PUBLIC_MARKETING_URL
              value: https://paymentops.cloudnova.tech
            # Server-only: where the Next.js proxy forwards requests (cluster-internal).
            - name: PAYMENTOPS_INTERNAL_API_URL
              value: http://paymentops-api:8000
            # Server-only: the operator tenant. Sessions from any other organization are denied.
            - name: PAYMENTOPS_OPERATOR_ORG_ID
              value: 9fa6b8d9-4c0d-4a4e-9a37-7aaec278c7e1
            # Server-only operator credentials, injected by the proxy. Never exposed to the
            # browser and never placed in a NEXT_PUBLIC_* variable.
            - name: PAYMENTOPS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: paymentops-web-operator
                  key: client-id
            - name: PAYMENTOPS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paymentops-web-operator
                  key: client-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
