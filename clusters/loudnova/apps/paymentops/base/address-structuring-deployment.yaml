apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentops-address-structuring
  namespace: paymentops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentops-address-structuring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: paymentops-address-structuring
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      # Seed the reference-data PVC from the bundled dev dataset. This PVC is dedicated to
      # the component's reference data, so it is wiped and re-seeded on each start.
      initContainers:
        - name: seed-resources
          image: ghcr.io/cloodnova/paymentops-address-structuring:de7e3d2fca25382c20b96004b7059497281af955
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "rm -rf /resources/* ; cp -r /bundled-resources/* /resources/"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: resources
              mountPath: /resources
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: address-structuring
          image: ghcr.io/cloodnova/paymentops-address-structuring:de7e3d2fca25382c20b96004b7059497281af955
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Model + reference data is mounted read-only from a PVC (seeded by initContainer).
          volumeMounts:
            - name: resources
              mountPath: /resources
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: resources
          persistentVolumeClaim:
            claimName: paymentops-address-resources
        - name: tmp
          emptyDir: {}
