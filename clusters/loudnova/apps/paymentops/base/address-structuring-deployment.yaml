apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentops-address-structuring
  namespace: paymentops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentops-address-structuring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: paymentops-address-structuring
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: address-structuring
          image: ghcr.io/cloodnova/paymentops-address-structuring:0ded7aacb7ff6036279629635b6f386867ff0af9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # Model + GeoNames-derived reference data is mounted read-only from a PVC.
          volumeMounts:
            - name: resources
              mountPath: /resources
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: resources
          persistentVolumeClaim:
            claimName: paymentops-address-resources
        - name: tmp
          emptyDir: {}
