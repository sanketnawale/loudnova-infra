apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paymentops-site-dev
  namespace: flux-system
spec:
  # Suspended until the marketing website image is published (repo: Cloodnova/PaymentOps_Website).
  # Remove `suspend` once the image tag in overlays/dev/patch-deployment.yaml is a real SHA.
  suspend: true
  interval: 5m
  path: ./clusters/loudnova/apps/paymentops-site/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
