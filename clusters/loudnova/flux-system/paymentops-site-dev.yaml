apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paymentops-site-dev
  namespace: flux-system
spec:
  # Image published from Cloodnova/PaymentOps_Website (pinned by SHA in overlays/dev).
  interval: 5m
  path: ./clusters/loudnova/apps/paymentops-site/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
